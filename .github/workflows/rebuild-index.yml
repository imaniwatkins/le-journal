name: Rebuild journal index

on:
  push:
    branches: [main]
    paths:
      - "data/days/**"
      - "data/sync_status.json"
      - "data/meta.json"
      - "scripts/build_index.py"
      - "scripts/trade_match.py"
      - "scripts/redact.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: ${{ !contains(github.event.head_commit.message, '[skip index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index and strip account ids
        run: python3 scripts/build_index.py
      - name: Commit index if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/derived/book.json data/days
          if git diff --cached --quiet; then
            echo "index already current"
          else
            git commit -m "Rebuild journal index [skip index]"
            git push
          fi
